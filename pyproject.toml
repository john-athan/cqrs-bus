[project]
name = "cqrs-bus"
version = "0.2.0"
description = "Async CQRS command/query bus and mediator for Python — handler auto-discovery, type-based dependency injection, middleware, and an event bus."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jonathan Kaleve", email = "jonathan.kaleve@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "cqrs",
    "command",
    "query",
    "bus",
    "async",
    "asyncio",
    "mediator",
    "mediator-pattern",
    "mediatr",
    "event-bus",
    "domain-events",
    "dependency-injection",
    "handler",
    "dispatch",
    "middleware",
    "ddd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/john-athan/cqrs-bus"
Repository = "https://github.com/john-athan/cqrs-bus"
Documentation = "https://github.com/john-athan/cqrs-bus#readme"
Issues = "https://github.com/john-athan/cqrs-bus/issues"

[project.optional-dependencies]
prometheus = ["prometheus-client>=0.21.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cqrs_bus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cqrs_bus"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B024"]
